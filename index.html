<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Site Audits</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a1bc9">
<meta name="background-color" content="#eef1f5">

<!-- Android / Chrome install -->
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS install (Add to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Site Audits">
<meta name="format-detection" content="telephone=no">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <button class="back" id="backMenu" onclick="goMenu()" style="display:none">‹ Menu</button>
      <!-- Optional logo: in app.js set LOGO_SRC (e.g. "logo.png") and drop the image file in this same folder. Leave "" for no logo. -->
      <img id="appLogo" class="logo" alt="" style="display:none">
      <div class="ttl" id="topTitle">Site Audits</div>
      <div class="step" id="topStep"></div>
    </div>
    <div class="pbar" id="pbarWrap" style="display:none"><span id="pbar"></span></div>
  </div>
  <div class="screen" id="screen"></div>
  <div class="nav" id="nav" style="display:none"></div>
</div>
<div id="printView"></div>

<script src="xlsx.full.min.js"></script>
<script src="exceljs.min.js"></script>
<script src="pctsi-template.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
